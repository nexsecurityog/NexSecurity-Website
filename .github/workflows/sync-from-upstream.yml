name: Sync from upstream (nexerisltd)

on:
  repository_dispatch:
    types: [upstream_updated]
  workflow_dispatch: {}
  schedule:
    - cron: '0 */6 * * *'   # safety net in case a dispatch ever gets missed

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/nexerisltd/NexSecurity-Website.git

      - name: Fetch upstream
        run: git fetch upstream main

      # Real merge, not --ff-only: this fork WILL keep picking up its own
      # commits over time (like the one that added this very file), so a
      # strict fast-forward would fail forever after the first such commit.
      # A normal merge still never discards a fork-only commit — it only
      # fails (and stops here, untouched) on a genuine line-level conflict,
      # which needs a human anyway.
      - name: Merge upstream into main
        run: git merge upstream/main --no-edit -m "Sync from upstream (nexerisltd)"

      - name: Push
        run: git push origin main
